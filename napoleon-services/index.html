  <header class="site-header">

      <a class="brand" href="#haut" data-logo>
        <svg class="brand-mark" aria-hidden="true"><use href="#emblem"/></svg>

        </span>

        <span></span><span></span>

      <nav class="nav" id="nav">

  <main id="contenu">

      <div class="hero-media photo-slot" data-photo="accueil" aria-hidden="true"></div>
      <div class="hero-glow" aria-hidden="true"></div>

      <div class="wrap hero-inner">
        <p class="eyebrow" data-t="hero.eyebrow"></p>
        <h1 class="hero-title split" data-t-rich="hero.title"></h1>
        <p class="hero-lead reveal" data-t="hero.lead"></p>
        <div class="hero-actions reveal">
          <a class="btn btn-gold" href="#reservation" data-t="hero.ctaBook"></a>
          <a class="link-line" href="#flotte" data-t="hero.ctaFleet"></a>
        </div>
      </div>
      <div class="wrap hero-foot">
        <p id="hero-address"></p>
        <a class="scroll-cue" href="#manifeste"><span data-t="hero.scroll"></span><i aria-hidden="true"></i></a>
        <p id="hero-phone"></p>
      </div>
    </section>

    <!-- BANDE DÉFILANTE -->
    <div class="marquee" aria-hidden="true">
      <div class="marquee-track" id="marquee"></div>
    </div>

    <!-- MANIFESTE -->
    <section class="section manifesto" id="manifeste">
      <div class="wrap manifesto-inner">
        <svg class="manifesto-emblem reveal" aria-hidden="true"><use href="#emblem"/></svg>
        <p class="eyebrow eyebrow-center" data-t="manifesto.eyebrow"></p>
        <h2 class="manifesto-title split" data-t-rich="manifesto.title"></h2>
        <p class="manifesto-text reveal" data-t="manifesto.text"></p>
      </div>
      <div class="wrap">
        <ol class="pillars" id="pillars"></ol>
      </div>
    </section>

    <!-- LA FLOTTE -->
    <section class="section section-alt" id="flotte">
      <div class="wrap">
        <div class="section-head">
          <p class="eyebrow eyebrow-center" data-t="fleet.eyebrow"></p>
          <h2 class="section-title split" data-t-rich="fleet.title"></h2>
          <p class="section-lead reveal" data-t="fleet.lead"></p>
        </div>
        <div class="chips reveal" id="fleet-filters" role="group"></div>
        <div class="fleet" id="fleet"></div>
        <p class="note" data-t="fleet.note"></p>
      </div>
    </section>

    <!-- AVEC CHAUFFEUR -->
    <section class="section" id="chauffeur">
      <div class="wrap chauffeur-grid">
        <div class="chauffeur-visual photo-slot reveal-img" data-photo="chauffeur" aria-hidden="true">
          <svg class="slot-emblem"><use href="#emblem"/></svg>
        </div>
        <div>
          <p class="eyebrow" data-t="chauffeur.eyebrow"></p>
          <h2 class="section-title split" data-t-rich="chauffeur.title"></h2>
          <p class="section-lead section-lead-left reveal" data-t="chauffeur.lead"></p>
          <ol class="services" id="chauffeur-services"></ol>
          <div class="types reveal">
            <p class="types-label" data-t="chauffeur.typesLabel"></p>
            <ul class="types-list" id="chauffeur-types"></ul>
          </div>
        </div>
      </div>
    </section>

    <!-- CONCIERGERIE -->
    <section class="section section-alt" id="conciergerie">
      <div class="wrap">
        <div class="section-head">
          <p class="eyebrow eyebrow-center" data-t="concierge.eyebrow"></p>
          <h2 class="section-title split" data-t-rich="concierge.title"></h2>
          <p class="section-lead reveal" data-t="concierge.lead"></p>
        </div>
        <ul class="concierge" id="concierge"></ul>
      </div>
    </section>

    <!-- LA MAISON -->
    <section class="section section-light" id="maison">
      <div class="wrap house-grid">
        <div>
          <p class="eyebrow" data-t="house.eyebrow"></p>
          <h2 class="section-title split" data-t-rich="house.title"></h2>
          <div class="prose reveal" id="house-text"></div>
          <p class="signature reveal" data-t="house.signature"></p>
        </div>
        <div class="house-visual photo-slot reveal-img" data-photo="maison" aria-hidden="true">
          <svg class="slot-emblem"><use href="#emblem"/></svg>
          <span class="house-year">MMXIV</span>
        </div>
      </div>
    </section>

    <!-- ÉTAPES -->
    <section class="section" id="etapes">
      <div class="wrap">
        <div class="section-head">
          <p class="eyebrow eyebrow-center" data-t="process.eyebrow"></p>
          <h2 class="section-title split" data-t-rich="process.title"></h2>
        </div>
        <ol class="steps" id="steps"></ol>
      </div>
    </section>

    <!-- RÉSERVATION -->
    <section class="section booking" id="reservation">
      <div class="wrap booking-inner">
        <div class="section-head">
          <p class="eyebrow eyebrow-center" data-t="booking.eyebrow"></p>
          <h2 class="section-title split" data-t-rich="booking.title"></h2>
          <p class="section-lead reveal" data-t="booking.lead"></p>
        </div>
        <form class="form reveal" id="booking-form" novalidate>
          <div class="field">
            <label for="f-name" data-t="booking.fields.name"></label>
            <input id="f-name" name="name" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="f-phone" data-t="booking.fields.phone"></label>
            <input id="f-phone" name="phone" type="tel" autocomplete="tel">
          </div>
          <div class="field">
            <label for="f-email" data-t="booking.fields.email"></label>
            <input id="f-email" name="email" type="email" autocomplete="email">
          </div>
          <div class="field">
            <label for="f-service" data-t="booking.fields.service"></label>
            <select id="f-service" name="service"></select>
          </div>
          <div class="field">
            <label for="f-vehicle" data-t="booking.fields.vehicle"></label>
            <select id="f-vehicle" name="vehicle"></select>
          </div>
          <div class="field-pair">
            <div class="field">
              <label for="f-from" data-t="booking.fields.from"></label>
              <input id="f-from" name="from" type="date">
            </div>
            <div class="field">
              <label for="f-to" data-t="booking.fields.to"></label>
              <input id="f-to" name="to" type="date">
            </div>
          </div>
          <div class="field field-full">
            <label for="f-message" data-t="booking.fields.message"></label>
            <textarea id="f-message" name="message" rows="4" data-t-attr="placeholder:booking.fields.messagePlaceholder"></textarea>
          </div>
          <p class="form-error field-full" id="form-error" role="alert" hidden></p>
          <div class="form-actions field-full" id="form-actions"></div>
          <p class="form-call field-full" id="form-call"></p>
          <p class="form-note field-full" data-t="booking.privacy"></p>
        </form>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="section section-alt" id="contact">
      <div class="wrap contact-grid">
        <div>
          <p class="eyebrow" data-t="contact.eyebrow"></p>
          <h2 class="section-title split" data-t-rich="contact.title"></h2>
          <dl class="contact-list reveal" id="contact-list"></dl>
        </div>
        <div class="reveal">
          <h3 class="sub-title" data-t="contact.hours"></h3>
          <table class="hours" id="hours"></table>
        </div>
        <div class="map" id="map"></div>
      </div>
    </section>

      <p class="footer-copy">
        © <span id="year"></span> Napoléon Services · <span data-t="footer.rights"></span>
        · <button class="link-button" type="button" id="open-legal" data-t="footer.legal"></button>
      </p>

  </footer>
